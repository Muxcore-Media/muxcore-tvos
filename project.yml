name: MuxCoreTV
options:
  bundleIdPrefix: systems.zem.muxcore
  deploymentTarget:
    tvOS: "17.0"
packages:
  MuxCoreAPI:
    path: Packages/MuxCoreAPI
targets:
  MuxCoreTV:
    type: application
    platform: tvOS
    sources:
      - path: MuxCoreTV/Sources
    resources:
      - path: MuxCoreTV/Resources
    dependencies:
      - package: MuxCoreAPI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.zem.muxcore.tv
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: MuxCore
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
